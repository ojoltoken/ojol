<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tebak Angka Premium - Ojol Game Portal</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           GAME STYLE - TEMA HIJAU GOJEK PREMIUM
           ============================================ */

        /* Container */
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            animation: slideUp 0.6s ease;
        }

        /* Header Game */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255,255,255,0.3);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .game-header:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(0, 170, 19, 0.1);
        }

        .back-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            border-color: var(--gojek-green);
            color: var(--gojek-green);
            background: var(--gojek-green-bg);
            transform: translateX(-2px);
        }

        .game-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--gojek-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-title .title-icon {
            font-size: 26px;
        }

        /* Status Bar */
        .game-status-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .game-status-bar:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(0, 170, 19, 0.1);
        }

        .status-item {
            text-align: center;
        }

        .status-item .label {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.8px;
        }

        .status-item .value {
            font-weight: 700;
            color: var(--gojek-green);
            font-size: 18px;
            margin-top: 2px;
        }

        .status-item .value.danger {
            color: var(--danger-color);
        }

        .status-item .value.warning {
            color: var(--warning-color);
        }

        /* Level Selector */
        .level-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .level-btn {
            padding: 10px 22px;
            border: 2px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-secondary);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 14px;
            min-width: 80px;
            position: relative;
            overflow: hidden;
        }

        .level-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gojek-green-gradient);
            opacity: 0;
            transition: var(--transition);
        }

        .level-btn:hover:not(.locked):not(.active) {
            border-color: var(--gojek-green);
            color: var(--gojek-green);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .level-btn.active {
            border-color: var(--gojek-green);
            background: var(--gojek-green);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 170, 19, 0.3);
            transform: scale(1.02);
        }

        .level-btn.unlocked {
            border-color: var(--gojek-green);
            color: var(--gojek-green);
        }

        .level-btn.unlocked:hover {
            background: var(--gojek-green-bg);
        }

        .level-btn.locked {
            opacity: 0.5;
            cursor: pointer;
        }

        .level-btn.locked:hover {
            border-color: var(--gojek-green);
            opacity: 0.8;
        }

        .level-btn.locked::after {
            content: ' 🔒';
            font-size: 12px;
        }

        /* Game Play Area */
        .game-play-area {
            background: var(--bg-card);
            padding: 30px 25px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            text-align: center;
            min-height: 380px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .game-play-area::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: rgba(0, 170, 19, 0.03);
            border-radius: 50%;
        }

        .game-play-area:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(0, 170, 19, 0.1);
        }

        .guess-display {
            font-size: 80px;
            font-weight: 900;
            color: var(--gojek-green);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            text-shadow: 0 4px 20px rgba(0, 170, 19, 0.15);
            transition: var(--transition);
        }

        .guess-display.pop {
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .hint-text {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .input-group input {
            padding: 14px 24px;
            border-radius: 50px;
            border: 2px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 20px;
            width: 160px;
            text-align: center;
            transition: var(--transition);
            font-weight: 600;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--gojek-green);
            box-shadow: 0 0 0 4px rgba(0, 170, 19, 0.1);
        }

        .input-group input:disabled {
            opacity: 0.5;
        }

        .input-group button {
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            background: var(--gojek-green-gradient);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0, 170, 19, 0.25);
            position: relative;
            overflow: hidden;
        }

        .input-group button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .input-group button:hover:not(:disabled)::after {
            transform: translateX(100%);
        }

        .input-group button:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 170, 19, 0.35);
        }

        .input-group button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .input-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Message Area */
        .message-area {
            min-height: 70px;
            margin: 15px 0;
        }

        .message {
            padding: 14px 24px;
            border-radius: var(--border-radius);
            font-weight: 600;
            animation: fadeIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .message.success {
            background: var(--gojek-green-bg);
            color: var(--gojek-green);
            border: 1px solid var(--gojek-green);
        }

        .message.error {
            background: rgba(252, 129, 129, 0.1);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .message.info {
            background: rgba(99, 179, 237, 0.1);
            color: var(--info-color);
            border: 1px solid var(--info-color);
        }

        /* Score Display */
        .score-display {
            display: flex;
            justify-content: space-around;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.8px;
        }

        .score-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--gojek-green);
            margin-top: 2px;
        }

        /* Connect Wallet UI */
        .connect-wallet-ui {
            text-align: center;
            padding: 40px 20px;
        }

        .connect-wallet-ui .icon {
            font-size: 72px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .connect-wallet-ui h3 {
            color: var(--gojek-green);
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .connect-wallet-ui p {
            color: var(--text-secondary);
            margin: 16px auto;
            max-width: 400px;
            line-height: 1.8;
        }

        .connect-wallet-ui .btn-connect {
            font-size: 18px;
            padding: 14px 44px;
            margin-top: 10px;
        }

        .connect-status {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Modal Unlock - Premium */
        .unlock-modal .modal {
            max-width: 420px;
        }

        .unlock-info {
            text-align: center;
            padding: 10px 0;
        }

        .unlock-info .price {
            font-size: 42px;
            color: var(--gojek-green);
            font-weight: 900;
            margin: 8px 0;
        }

        .unlock-info .price-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .wallet-status {
            padding: 14px 20px;
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            margin: 16px 0;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-status .label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .wallet-status .value {
            color: var(--gojek-green);
            font-weight: 700;
            font-size: 16px;
        }

        .unlock-btn {
            padding: 16px 30px;
            background: var(--gojek-green-gradient);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            margin: 10px 0;
            box-shadow: 0 4px 15px rgba(0, 170, 19, 0.25);
        }

        .unlock-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 170, 19, 0.35);
        }

        .unlock-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .unlock-btn .btn-icon {
            margin-right: 8px;
        }

        /* Reset Button */
        .reset-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .reset-btn:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
            background: rgba(252, 129, 129, 0.1);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            max-width: 380px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 16px 20px;
            border-radius: var(--border-radius);
            animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-card);
            border-left: 4px solid var(--gojek-green);
        }

        .toast.success { border-left-color: var(--gojek-green); }
        .toast.error { border-left-color: var(--danger-color); }
        .toast.info { border-left-color: var(--info-color); }

        .toast .toast-icon { font-size: 22px; }
        .toast .toast-message {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .game-container {
                padding: 10px;
            }

            .game-header {
                padding: 12px 16px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .game-title {
                font-size: 18px;
            }

            .game-status-bar {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 12px 16px;
            }

            .status-item .value {
                font-size: 16px;
            }

            .guess-display {
                font-size: 56px;
                min-height: 70px;
            }

            .game-play-area {
                padding: 20px 15px;
                min-height: 320px;
            }

            .input-group input {
                width: 110px;
                font-size: 18px;
                padding: 12px 16px;
            }

            .input-group button {
                padding: 12px 24px;
                font-size: 15px;
            }

            .level-btn {
                padding: 8px 16px;
                font-size: 12px;
                min-width: 65px;
            }

            .score-display {
                flex-wrap: wrap;
                gap: 10px;
                padding: 12px 16px;
            }

            .score-value {
                font-size: 18px;
            }

            .modal {
                padding: 24px 20px;
                width: 95%;
            }

            .unlock-info .price {
                font-size: 34px;
            }

            .wallet-status {
                flex-direction: column;
                gap: 4px;
            }
        }

        @media (max-width: 380px) {
            .guess-display {
                font-size: 42px;
                min-height: 60px;
            }

            .input-group input {
                width: 90px;
                font-size: 16px;
                padding: 10px 12px;
            }

            .level-btn {
                padding: 6px 12px;
                font-size: 11px;
                min-width: 55px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <div class="game-header">
            <a href="../../index.html" class="back-btn">← Kembali</a>
            <span class="game-title">
                <span class="title-icon">🎯</span> Tebak Angka
            </span>
            <button class="reset-btn" onclick="window.resetGame && resetGame()">
                🔄 Reset
            </button>
        </div>

        <!-- Status Bar -->
        <div class="game-status-bar" id="statusBar">
            <div class="status-item">
                <div class="label">Level</div>
                <div class="value" id="currentLevel">1</div>
            </div>
            <div class="status-item">
                <div class="label">Percobaan</div>
                <div class="value" id="attempts">0</div>
            </div>
            <div class="status-item">
                <div class="label">Waktu</div>
                <div class="value" id="timer">30s</div>
            </div>
            <div class="status-item">
                <div class="label">Wallet</div>
                <div class="value" id="walletStatus">✅ Connected</div>
            </div>
        </div>

        <!-- Level Selector -->
        <div class="level-selector" id="levelSelector"></div>

        <!-- Game Area -->
        <div class="game-play-area" id="gameArea">
            <div id="gameContent">
                <div class="guess-display" id="guessDisplay">?</div>
                <div class="hint-text" id="hintText">Tebak angka antara 1 - 10</div>
                
                <div class="input-group">
                    <input type="number" id="guessInput" min="1" max="10" placeholder="Angka">
                    <button id="guessBtn">Tebak!</button>
                </div>
                
                <div class="message-area" id="messageArea"></div>
                
                <div class="score-display">
                    <div class="score-item">
                        <div class="score-label">Level</div>
                        <div class="score-value" id="scoreLevel">1</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Percobaan</div>
                        <div class="score-value" id="scoreAttempts">0</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Terbaik</div>
                        <div class="score-value" id="scoreBest">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Unlock -->
    <div class="modal-overlay unlock-modal" id="unlockModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">🔓 Buka Level</span>
                <button class="modal-close" onclick="closeUnlockModal()">✕</button>
            </div>
            <div class="unlock-info">
                <div class="price-label">Buka level ini seharga</div>
                <div class="price" id="unlockPrice">10 OJOL</div>
                <div class="wallet-status">
                    <span class="label">Saldo Anda</span>
                    <span class="value" id="unlockBalance">0 OJOL</span>
                </div>
                <button class="unlock-btn" id="unlockConfirmBtn">
                    <span class="btn-icon">💳</span> Bayar 10 OJOL
                </button>
                <p style="color: var(--text-muted); font-size: 11px; margin-top: 12px; word-break: break-all;">
                    Token akan ditransfer ke:<br>
                    <span style="font-family: monospace; font-size: 12px;">0x0F451D746EFD63397d413eD6d4A994356ba61421</span>
                </p>
                <div id="unlockMessage" style="margin-top: 16px;"></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="../../js/web3-config.js"></script>
    <script src="../../js/wallet-manager.js"></script>
    <script src="../../js/game-manager.js"></script>

    <!-- ============================================ -->
    <!-- GAME SCRIPT - PREMIUM VERSION -->
    <!-- ============================================ -->

    <script>
    // ============================================
    // GAME - PREMIUM VERSION
    // ============================================

    (function() {
        'use strict';

        // === STATE ===
        const state = {
            gameId: 'tebak-angka',
            currentLevel: 1,
            targetNumber: 0,
            attempts: 0,
            maxAttempts: 5,
            timeLimit: 30,
            timeRemaining: 30,
            timerInterval: null,
            isPlaying: false,
            gameOver: false,
            isProcessing: false,
            gameConfig: null,
            unlockedLevels: [1],
            bestScores: {},
            isInitialized: false
        };

        // === DOM REFS ===
        const dom = {};

        function getDOMElements() {
            dom.gameArea = document.getElementById('gameArea');
            dom.gameContent = document.getElementById('gameContent');
            dom.levelSelector = document.getElementById('levelSelector');
            dom.currentLevel = document.getElementById('currentLevel');
            dom.attempts = document.getElementById('attempts');
            dom.timer = document.getElementById('timer');
            dom.walletStatus = document.getElementById('walletStatus');
            dom.guessDisplay = document.getElementById('guessDisplay');
            dom.hintText = document.getElementById('hintText');
            dom.guessInput = document.getElementById('guessInput');
            dom.guessBtn = document.getElementById('guessBtn');
            dom.messageArea = document.getElementById('messageArea');
            dom.scoreLevel = document.getElementById('scoreLevel');
            dom.scoreAttempts = document.getElementById('scoreAttempts');
            dom.scoreBest = document.getElementById('scoreBest');
            dom.unlockModal = document.getElementById('unlockModal');
            dom.unlockPrice = document.getElementById('unlockPrice');
            dom.unlockBalance = document.getElementById('unlockBalance');
            dom.unlockMessage = document.getElementById('unlockMessage');
            dom.unlockConfirmBtn = document.getElementById('unlockConfirmBtn');
            dom.toastContainer = document.getElementById('toastContainer');
        }

        // === DIFFICULTY ===
        function getDifficulty(level) {
            const diffs = {
                1: { max: 10, attempts: 5, timeLimit: 30, label: 'Mudah' },
                2: { max: 25, attempts: 4, timeLimit: 20, label: 'Sedang' },
                3: { max: 50, attempts: 4, timeLimit: 15, label: 'Sulit' },
                4: { max: 75, attempts: 3, timeLimit: 12, label: 'Sangat Sulit' },
                5: { max: 100, attempts: 3, timeLimit: 10, label: 'Expert' }
            };
            return diffs[level] || diffs[1];
        }

        // === LOAD BEST SCORES ===
        function loadBestScores() {
            try {
                const saved = localStorage.getItem('bestScores_tebak-angka');
                return saved ? JSON.parse(saved) : {};
            } catch { return {}; }
        }

        function saveBestScore(level, attempts) {
            if (!state.bestScores[level] || attempts < state.bestScores[level]) {
                state.bestScores[level] = attempts;
                try {
                    localStorage.setItem('bestScores_tebak-angka', JSON.stringify(state.bestScores));
                } catch (e) {}
            }
        }

        // === LOAD GAME CONFIG ===
        function loadGameConfig() {
            if (typeof gameManager !== 'undefined' && gameManager) {
                const config = gameManager.getGame(state.gameId);
                if (config) {
                    state.gameConfig = config;
                    state.unlockedLevels = [1];
                    for (let i = 2; i <= config.levels; i++) {
                        if (gameManager.isLevelUnlocked(state.gameId, i)) {
                            state.unlockedLevels.push(i);
                        }
                    }
                    return;
                }
            }
            state.gameConfig = { id: 'tebak-angka', title: 'Tebak Angka Premium', levels: 5, price: 10 };
            state.unlockedLevels = [1];
        }

        // === TOAST ===
        function showToast(message, type = 'info') {
            if (!dom.toastContainer) return;
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span>
                <span class="toast-message">${message}</span>
            `;
            dom.toastContainer.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.3s';
                    setTimeout(() => {
                        if (toast.parentNode) toast.remove();
                    }, 300);
                }
            }, 4000);
        }

        // === RENDER LEVEL BUTTONS ===
        function renderLevelButtons() {
            if (!dom.levelSelector) return;
            dom.levelSelector.innerHTML = '';
            
            const levels = state.gameConfig ? state.gameConfig.levels : 5;
            
            for (let i = 1; i <= levels; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.dataset.level = i;
                
                const isUnlocked = state.unlockedLevels.includes(i);
                const isActive = i === state.currentLevel;
                
                if (isUnlocked) {
                    btn.classList.add('unlocked');
                    btn.textContent = `Level ${i}`;
                } else {
                    btn.classList.add('locked');
                    btn.textContent = `Level ${i} 🔒`;
                }
                
                if (isActive) {
                    btn.classList.add('active');
                }
                
                btn.addEventListener('click', function() {
                    const level = parseInt(this.dataset.level);
                    selectLevel(level);
                });
                
                dom.levelSelector.appendChild(btn);
            }
        }

        // === SELECT LEVEL ===
        function selectLevel(level) {
            const isUnlocked = state.unlockedLevels.includes(level);
            
            if (!isUnlocked) {
                state.pendingUnlockLevel = level;
                showUnlockModal(level);
                return;
            }
            
            if (state.isPlaying && !state.gameOver) {
                if (!confirm('Game sedang berlangsung. Yakin ingin pindah level?')) {
                    return;
                }
            }
            
            state.currentLevel = level;
            startLevel(level);
            renderLevelButtons();
        }

        // === START LEVEL ===
        function startLevel(level) {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            
            const diff = getDifficulty(level);
            state.targetNumber = Math.floor(Math.random() * diff.max) + 1;
            state.maxAttempts = diff.attempts;
            state.timeLimit = diff.timeLimit;
            state.timeRemaining = diff.timeLimit;
            state.attempts = 0;
            state.gameOver = false;
            state.isPlaying = true;
            state.isProcessing = false;
            
            dom.currentLevel.textContent = level;
            dom.attempts.textContent = '0';
            dom.timer.textContent = diff.timeLimit + 's';
            dom.timer.className = 'value';
            dom.guessDisplay.textContent = '?';
            dom.guessDisplay.className = 'guess-display';
            dom.hintText.textContent = `Tebak angka antara 1 - ${diff.max} (${diff.label})`;
            dom.guessInput.max = diff.max;
            dom.guessInput.placeholder = `1-${diff.max}`;
            dom.guessInput.disabled = false;
            dom.guessInput.value = '';
            dom.guessBtn.disabled = false;
            dom.messageArea.innerHTML = '';
            dom.scoreLevel.textContent = level;
            dom.scoreAttempts.textContent = '0';
            
            const best = state.bestScores[level];
            dom.scoreBest.textContent = best ? `${best}x` : '-';
            
            setTimeout(() => dom.guessInput.focus(), 100);
            
            state.timerInterval = setInterval(function() {
                state.timeRemaining--;
                dom.timer.textContent = state.timeRemaining + 's';
                
                if (state.timeRemaining <= 5) {
                    dom.timer.className = 'value danger';
                }
                
                if (state.timeRemaining <= 0) {
                    endGame(false, '⏰ Waktu habis!');
                }
            }, 1000);
            
            console.log(`🎯 Level ${level} dimulai! Target: ${state.targetNumber}`);
        }

        // === HANDLE GUESS ===
        function handleGuess() {
            if (!state.isPlaying || state.gameOver || state.isProcessing) return;
            if (!dom.guessInput) return;
            
            const input = dom.guessInput;
            const guess = parseInt(input.value);
            const diff = getDifficulty(state.currentLevel);
            
            if (isNaN(guess) || guess < 1 || guess > diff.max) {
                showMessage(`Masukkan angka antara 1 - ${diff.max}!`, 'error');
                input.value = '';
                input.focus();
                return;
            }
            
            state.isProcessing = true;
            state.attempts++;
            
            dom.attempts.textContent = state.attempts;
            dom.scoreAttempts.textContent = state.attempts;
            dom.guessDisplay.textContent = guess;
            dom.guessDisplay.className = 'guess-display pop';
            setTimeout(() => {
                dom.guessDisplay.className = 'guess-display';
            }, 300);
            
            if (guess === state.targetNumber) {
                endGame(true);
            } else {
                const hint = guess < state.targetNumber ? '📈 Terlalu kecil!' : '📉 Terlalu besar!';
                const remaining = state.maxAttempts - state.attempts;
                showMessage(`${hint} (Sisa ${remaining} percobaan)`, 'info');
                
                setTimeout(() => {
                    dom.guessDisplay.textContent = '?';
                }, 500);
                
                input.value = '';
                input.focus();
                
                if (state.attempts >= state.maxAttempts) {
                    endGame(false, `😅 Percobaan habis! Angka yang benar adalah ${state.targetNumber}`);
                }
            }
            
            state.isProcessing = false;
        }

        // === END GAME ===
        function endGame(win, customMessage) {
            if (state.gameOver) return;
            
            state.gameOver = true;
            state.isPlaying = false;
            
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            
            dom.guessInput.disabled = true;
            dom.guessBtn.disabled = true;
            
            if (win) {
                saveBestScore(state.currentLevel, state.attempts);
                showMessage(`🎉 Selamat! Anda menebak dengan ${state.attempts} percobaan!`, 'success');
                dom.guessDisplay.textContent = state.targetNumber;
                
                const best = state.bestScores[state.currentLevel];
                dom.scoreBest.textContent = best ? `${best}x` : '-';
                
                if (typeof gameManager !== 'undefined' && gameManager) {
                    gameManager.incrementGamesPlayed();
                }
                
                const nextLevel = state.currentLevel + 1;
                if (nextLevel <= state.gameConfig.levels) {
                    if (!state.unlockedLevels.includes(nextLevel)) {
                        state.unlockedLevels.push(nextLevel);
                        if (typeof gameManager !== 'undefined' && gameManager) {
                            const key = `${state.gameId}-level-${nextLevel}`;
                            gameManager.unlockedLevels[key] = true;
                            gameManager.saveToStorage();
                        }
                        renderLevelButtons();
                        showToast(`🎯 Level ${nextLevel} terbuka!`, 'success');
                        
                        setTimeout(() => {
                            if (confirm(`🎯 Level ${nextLevel} sekarang terbuka! Lanjutkan?`)) {
                                selectLevel(nextLevel);
                            }
                        }, 1000);
                    } else {
                        setTimeout(() => {
                            if (confirm(`🎯 Lanjut ke Level ${nextLevel}?`)) {
                                selectLevel(nextLevel);
                            }
                        }, 1000);
                    }
                } else {
                    setTimeout(() => {
                        showToast('🏆 Anda telah menyelesaikan semua level!', 'success');
                    }, 500);
                }
            } else {
                const message = customMessage || '😅 Coba lagi!';
                showMessage(message, 'error');
                dom.guessDisplay.textContent = state.targetNumber;
                
                setTimeout(() => {
                    if (confirm('🔄 Coba lagi?')) {
                        startLevel(state.currentLevel);
                    }
                }, 800);
            }
        }

        // === SHOW MESSAGE ===
        function showMessage(text, type) {
            if (!dom.messageArea) return;
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            dom.messageArea.innerHTML = `
                <div class="message ${type}">
                    <span>${icons[type] || 'ℹ️'}</span>
                    <span>${text}</span>
                </div>
            `;
        }

        // === UNLOCK MODAL ===
        function showUnlockModal(level) {
            if (!dom.unlockModal) return;
            
            const price = state.gameConfig ? state.gameConfig.price : 10;
            const balance = (typeof walletManager !== 'undefined' && walletManager.isConnected) ? 
                (walletManager.balance || 0) : 0;
            
            dom.unlockPrice.textContent = `${price} OJOL`;
            dom.unlockBalance.textContent = `${balance.toFixed(2)} OJOL`;
            dom.unlockMessage.innerHTML = '';
            
            dom.unlockConfirmBtn.onclick = function() {
                processUnlock(level);
            };
            dom.unlockConfirmBtn.disabled = false;
            dom.unlockConfirmBtn.innerHTML = `<span class="btn-icon">💳</span> Bayar ${price} OJOL`;
            
            dom.unlockModal.classList.add('active');
            state.pendingUnlockLevel = level;
        }

        function closeUnlockModal() {
            if (dom.unlockModal) dom.unlockModal.classList.remove('active');
            if (dom.unlockMessage) dom.unlockMessage.innerHTML = '';
            state.pendingUnlockLevel = null;
        }

        async function processUnlock(level) {
            if (!dom.unlockConfirmBtn || !dom.unlockMessage) return;
            
            if (typeof walletManager === 'undefined' || !walletManager.isConnected) {
                dom.unlockMessage.innerHTML = `<div class="message error">❌ Wallet belum terhubung!</div>`;
                return;
            }
            
            const price = state.gameConfig ? state.gameConfig.price : 10;
            const balance = walletManager.balance || 0;
            
            if (balance < price) {
                dom.unlockMessage.innerHTML = `
                    <div class="message error">❌ Saldo tidak cukup! Saldo: ${balance.toFixed(2)} OJOL, Harga: ${price} OJOL</div>
                `;
                return;
            }
            
            dom.unlockConfirmBtn.disabled = true;
            dom.unlockConfirmBtn.innerHTML = `<span class="btn-icon">⏳</span> Memproses...`;
            dom.unlockMessage.innerHTML = `<div class="message info">⏳ Memproses pembayaran...</div>`;
            
            try {
                const result = await gameManager.unlockLevel(state.gameId, level);
                
                if (result.success) {
                    dom.unlockMessage.innerHTML = `<div class="message success">✅ ${result.message}</div>`;
                    
                    if (!state.unlockedLevels.includes(level)) {
                        state.unlockedLevels.push(level);
                    }
                    
                    renderLevelButtons();
                    
                    setTimeout(() => {
                        closeUnlockModal();
                        selectLevel(level);
                        showToast(`✅ Level ${level} berhasil dibuka!`, 'success');
                    }, 1500);
                } else {
                    dom.unlockMessage.innerHTML = `<div class="message error">❌ ${result.error}</div>`;
                    dom.unlockConfirmBtn.disabled = false;
                    dom.unlockConfirmBtn.innerHTML = `<span class="btn-icon">💳</span> Bayar ${price} OJOL`;
                }
            } catch (error) {
                console.error('Unlock error:', error);
                dom.unlockMessage.innerHTML = `<div class="message error">❌ Error: ${error.message}</div>`;
                dom.unlockConfirmBtn.disabled = false;
                dom.unlockConfirmBtn.innerHTML = `<span class="btn-icon">💳</span> Bayar ${price} OJOL`;
            }
        }

        // === RESET GAME ===
        window.resetGame = function() {
            if (!confirm('⚠️ Yakin ingin mereset semua progress?\n\nLevel 2-5 akan terkunci kembali.')) {
                return;
            }
            
            state.unlockedLevels = [1];
            state.bestScores = {};
            localStorage.removeItem('bestScores_tebak-angka');
            
            if (typeof gameManager !== 'undefined' && gameManager) {
                for (let i = 2; i <= state.gameConfig.levels; i++) {
                    const key = `${state.gameId}-level-${i}`;
                    delete gameManager.unlockedLevels[key];
                }
                gameManager.saveToStorage();
            }
            
            renderLevelButtons();
            startLevel(1);
            showToast('✅ Game direset! Hanya Level 1 yang terbuka.', 'success');
        };

        // === CHECK WALLET ===
        async function checkWallet() {
            if (typeof walletManager === 'undefined') return false;
            
            if (walletManager.isConnected) {
                dom.walletStatus.textContent = '✅ ' + (walletManager.account ? 
                    walletManager.account.slice(0, 6) + '...' + walletManager.account.slice(-4) : 'Connected');
                dom.walletStatus.className = 'value';
                return true;
            }
            
            try {
                const result = await walletManager.connect();
                if (result && result.success) {
                    dom.walletStatus.textContent = '✅ ' + (walletManager.account ? 
                        walletManager.account.slice(0, 6) + '...' + walletManager.account.slice(-4) : 'Connected');
                    dom.walletStatus.className = 'value';
                    return true;
                }
            } catch (e) {}
            
            dom.walletStatus.textContent = '❌ Not Connected';
            dom.walletStatus.className = 'value danger';
            return false;
        }

        // === SHOW CONNECT UI ===
        function showConnectUI() {
            if (!dom.gameArea) return;
            dom.gameArea.innerHTML = `
                <div class="connect-wallet-ui">
                    <div class="icon">🔗</div>
                    <h3>Hubungkan Wallet</h3>
                    <p>
                        Untuk memainkan game ini, Anda perlu menghubungkan wallet terlebih dahulu.<br>
                        <span style="font-size: 14px; color: var(--text-muted);">
                            🦊 Pastikan menggunakan <strong>MetaMask</strong> di jaringan <strong>BSC Mainnet</strong>
                        </span>
                    </p>
                    <button class="btn-connect" onclick="window.handleConnectWallet()">
                        🔌 Hubungkan Wallet
                    </button>
                    <div class="connect-status" id="connectStatus">
                        ⏳ Klik tombol di atas untuk menghubungkan
                    </div>
                </div>
            `;
        }

        // === CONNECT WALLET HANDLER ===
        window.handleConnectWallet = async function() {
            const statusEl = document.getElementById('connectStatus');
            
            try {
                if (statusEl) {
                    statusEl.textContent = '⏳ Menghubungkan...';
                    statusEl.style.color = 'var(--gojek-green)';
                }
                
                if (typeof window.ethereum === 'undefined') {
                    throw new Error('MetaMask tidak terdeteksi!');
                }
                
                if (typeof walletManager === 'undefined') {
                    throw new Error('Wallet Manager tidak ditemukan!');
                }
                
                const result = await walletManager.connect();
                
                if (result && result.success) {
                    if (statusEl) {
                        statusEl.textContent = '✅ Wallet terhubung! Memuat game...';
                        statusEl.style.color = 'var(--gojek-green)';
                    }
                    showToast('Wallet berhasil terhubung!', 'success');
                    
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    throw new Error(result?.error || 'Gagal menghubungkan wallet');
                }
            } catch (error) {
                if (statusEl) {
                    statusEl.textContent = `❌ ${error.message}`;
                    statusEl.style.color = 'var(--danger-color)';
                }
                showToast('Error: ' + error.message, 'error');
            }
        };

        // === INIT GAME ===
        async function initGame() {
            console.log('🎮 Inisialisasi Game...');
            
            getDOMElements();
            
            const isConnected = await checkWallet();
            
            if (!isConnected) {
                showConnectUI();
                return;
            }
            
            state.bestScores = loadBestScores();
            loadGameConfig();
            
            renderLevelButtons();
            startLevel(1);
            
            state.isInitialized = true;
            console.log('✅ Game siap dimainkan!');
        }

        // === EVENT LISTENERS ===
        function setupEventListeners() {
            const guessBtn = document.getElementById('guessBtn');
            if (guessBtn) {
                guessBtn.addEventListener('click', handleGuess);
            }
            
            const guessInput = document.getElementById('guessInput');
            if (guessInput) {
                guessInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleGuess();
                    }
                });
            }
            
            const modal = document.getElementById('unlockModal');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeUnlockModal();
                    }
                });
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeUnlockModal();
                }
            });
            
            console.log('✅ Event listeners setup');
        }

        // === EXPOSE GLOBAL ===
        window.closeUnlockModal = closeUnlockModal;
        window.debugGame = {
            state: state,
            startLevel: startLevel,
            selectLevel: selectLevel,
            reset: window.resetGame,
            forceUnlock: function(level) {
                if (!state.unlockedLevels.includes(level)) {
                    state.unlockedLevels.push(level);
                }
                renderLevelButtons();
                showToast(`Level ${level} di-unlock (debug)`, 'info');
            }
        };

        // === START ===
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM ready');
            setTimeout(function() {
                initGame();
                setupEventListeners();
            }, 300);
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(function() {
                initGame();
                setupEventListeners();
            }, 300);
        }

        console.log('🛠️ Debug: Ketik debugGame di console');
        console.log('   - debugGame.forceUnlock(2) - Unlock level 2');
        console.log('   - debugGame.reset() - Reset ke level 1');
        console.log('   - debugGame.state - Lihat state game');

    })();
    </script>

</body>
</html>
